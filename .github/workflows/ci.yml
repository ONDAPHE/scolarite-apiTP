name: CI

on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - run: chmod +x mvnw

      - run: ./mvnw -B verify

      - uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar