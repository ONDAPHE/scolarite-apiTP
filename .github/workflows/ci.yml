name: CI

on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - run: chmod +x mvnw

      - run: ./mvnw -B verify

      - name: Résumé de couverture
        run: |
          awk -F"," '{ i += $4 + $5; c += $5 } END { printf "### Couverture JaCoCo : %.1f %%\n", 100*c/i }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

      - uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar